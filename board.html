<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>커뮤니티 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="community">
<div id="header-slot"></div>

<main class="wrap layout">
  <section class="board">
    <h1 class="board-title" id="b-title">자유게시판</h1>

    <div class="pop">
      <div class="pop-tabs" role="tablist">
        <button class="on" type="button" data-t="m">월간인기글</button>
        <button type="button" data-t="w">주간인기글</button>
      </div>
      <ul class="pop-list" id="pop"></ul>
    </div>

    <div class="panel">
      <table class="list">
        <colgroup><col style="width:64px"><col><col style="width:110px"><col style="width:96px"><col style="width:56px"></colgroup>
        <thead><tr><th>번호</th><th>제목</th><th>이름</th><th>날짜</th><th>조회</th></tr></thead>
        <tbody id="post-list"></tbody>
      </table>
      <p class="empty" id="b-empty" hidden>검색 결과가 없어요.</p>
      <div class="board-foot">
        <form class="board-search" id="b-search">
          <select id="b-field" aria-label="검색 항목"><option value="title">제목</option><option value="author">이름</option></select>
          <input id="b-q" type="search" aria-label="게시판 검색">
          <button type="submit">검색</button>
        </form>
        <button class="write-btn" id="write" type="button">✏️ 글쓰기</button>
      </div>
      <nav class="pager" id="pager" aria-label="페이지"></nav>
    </div>
  </section>

  <aside class="side" id="sidebar-slot"></aside>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="sidebar.js"></script>
<script src="boarddata.js"></script>
<script src="board.js"></script>
</body>
</html>
