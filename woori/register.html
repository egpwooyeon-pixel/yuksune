<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>체험단 등록 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="campaigns">
<div id="header-slot"></div>

<main class="wrap camp">
  <div class="camp-head"><h1>체험단 등록하기</h1><a class="muted" href="campaigns.html">← 목록으로</a></div>

  <form class="panel reg" id="reg-form">
    <p class="notice-box" id="gate" hidden></p>

    <div class="row two">
      <label>체험단 종류
        <select name="type"><option>블로그</option><option>구매평</option><option>인스타</option></select></label>
      <label>진행 방식
        <select name="mode" id="mode"><option>방문형</option><option>배송형</option></select></label>
    </div>

    <div class="row two">
      <label>지역
        <select name="region" id="region"><option>서울</option><option>수도권</option><option>지방</option><option>제주</option></select></label>
      <label>분야
        <select name="cat"><option>맛집</option><option>카페</option><option>뷰티</option><option>숙박</option><option>놀이</option><option>생활</option></select></label>
    </div>

    <label>업체명 <input name="biz" required maxlength="20" placeholder="예) 성수루프"></label>
    <label>모집글 제목 <input name="title" required maxlength="60" placeholder="예) 성수동 루프탑 카페 신메뉴 체험단 모집"></label>
    <label>제공 혜택 <input name="reward" required maxlength="40" placeholder="예) 음료 2잔 + 디저트"></label>

    <div class="row two">
      <label>모집 인원 <input name="slots" type="number" min="1" max="999" value="5" required></label>
      <label>모집 마감일 <input name="deadline" type="date" required></label>
    </div>

    <div id="visit-box">
      <div class="row two">
        <label>방문 가능 시작일 <small>(선택)</small> <input name="visit_start" type="date"></label>
        <label>방문 가능 종료일 <small>(선택)</small> <input name="visit_end" type="date"></label>
      </div>
      <label>1팀 최대 방문 인원 <input name="max_party" type="number" min="1" max="10" value="4"></label>
    </div>

    <label>추가 미션 <small>(선택 · 예: 방문 후 24시간 내 후기 작성)</small>
      <input name="mission" maxlength="100"></label>
    <p class="muted small" style="margin-top:-8px">※ 대가를 받고 작성하는 후기에는 <b>광고·협찬 표기</b>가 필요합니다. 추가 미션에 표기 문구를 넣어 주세요.</p>

    <label>네이버 플레이스 주소 <small>(선택)</small>
      <input name="place" type="url" placeholder="https://naver.me/... 또는 https://map.naver.com/..."></label>

    <label>대표 사진
      <input id="photo" type="file" accept="image/*"></label>
    <div class="preview" id="preview" hidden></div>

    <label>상세 안내 <small>(방문 가능 시간, 작성 조건 등)</small>
      <textarea name="desc" rows="5" maxlength="1000"></textarea></label>

    <p class="muted small">신청자는 광고주가 직접 선정합니다. 후기는 게시일로부터 <b>6개월까지 2차 활용</b>할 수 있다는 동의를 신청자에게 받습니다. 구매평 체험단은 포인트가 지급되지 않습니다.</p>
    <button class="btn-primary submit" type="submit">등록하기</button>
  </form>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="register.js"></script>
</body>
</html>
