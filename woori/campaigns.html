<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>체험단 모집 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="campaigns">
<div id="header-slot"></div>

<main class="wrap camp">
  <div class="camp-head">
    <h1 id="page-title">블로그체험단</h1>
    <div class="head-tools">
      <div class="chips" id="region-chips"></div>
      <form class="mini-search" id="search-form"><input id="q" placeholder="블로그 체험단 검색" aria-label="검색"><button aria-label="검색">🔍</button></form>
    </div>
  </div>

  <div class="panel camp-panel">
    <div class="guide">
      <div class="guide-text">
        <h2>❗ <span id="guide-title">블로그 체험단</span> 안내</h2>
        <p><b>사업자인증 받은 업체만</b> 등록할 수 있으며,<br><b>우리들 체험단 회원</b>이라면 누구나 참여가 가능합니다.<br>체험하고 싶은 캠페인에 신청하면 <b>광고주가 직접 선정</b>합니다.<span id="point-note"></span></p>
      </div>
      <a class="guide-btn" href="register.html"><small>| 사업자 전용</small><b>체험단<br>등록하기</b></a>
      <a class="guide-btn" href="#"><small>| 회원 전용</small><b>체험단<br>기본 가이드</b></a>
    </div>

    <ul class="cards five" id="cards"></ul>
    <p class="empty" id="empty" hidden>조건에 맞는 캠페인이 없어요.</p>
    <div class="more"><button id="more" type="button">더보기</button></div>
  </div>
</main>

<div id="footer-slot"></div>
<script src="common.js"></script>
<script src="campaigns.js"></script>
</body>
</html>
