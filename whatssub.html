<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>결제기반 AI 마케팅 왓섭 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="whatssub">
<div id="header-slot"></div>

<main class="wrap camp ws-page">
  <section class="panel ws-hero">
    <img src="assets/whatssub-logo.png" alt="왓섭 Whatssub" width="210" height="38">
    <h1>결제 기반 데이터로 하는<br>AI 마케팅</h1>
    <p class="muted">고객의 결제 데이터를 바탕으로 마케팅하는 왓섭을 소개해요. 아래에서 상담을 신청하면 담당자가 연락드려요.</p>
    <ul class="ws-points">
      <li><b>결제 기반 데이터</b><span>실제 결제 흐름을 바탕으로 고객과 시장을 살펴봐요.</span></li>
      <li><b>AI 마케팅</b><span>데이터를 활용해 마케팅 방향을 제안해요.</span></li>
      <li><b>상담 후 안내</b><span>서비스 범위와 조건은 상담에서 안내해 드려요.</span></li>
    </ul>
  </section>

  <section class="panel reg ws-form-box" id="apply">
    <h2>상담 신청</h2>
    <p class="muted small" id="ws-note">신청 내용은 우리들 체험단 운영자가 확인한 뒤 왓섭 상담으로 이어 드려요.</p>
    <form id="ws-form" novalidate>
      <input class="ws-hp" name="website2" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>업체명 <input id="ws-company" maxlength="100" autocomplete="organization" required></label>
      <label>담당자 이름 <input id="ws-name" maxlength="50" autocomplete="name" required></label>
      <label>연락처 <input id="ws-phone" type="tel" inputmode="tel" maxlength="20" placeholder="010-0000-0000" autocomplete="tel" required></label>
      <label>홈페이지 또는 플레이스 주소 <small>(선택)</small> <input id="ws-web" maxlength="200" placeholder="예) egp.kr" autocomplete="url"></label>
      <label>문의 내용 <small>(선택)</small> <textarea id="ws-msg" rows="4" maxlength="2000"></textarea></label>
      <label class="check"><input type="checkbox" id="ws-agree1"> <span><b>개인정보 수집·이용에 동의합니다. (필수)</b><br><small>수집 항목: 업체명·이름·연락처·홈페이지·문의 내용 / 이용 목적: 왓섭 서비스 상담 연결 · <a href="privacy.html" target="_blank" rel="noopener">처리방침 보기</a></small></span></label>
      <label class="check" id="ws-share-row"><input type="checkbox" id="ws-agree2"> <span><b>상담을 위해 왓섭에 위 정보를 제공하는 것에 동의합니다. (필수)</b><br><small>제공받는 자: 왓섭 / 제공 목적: 서비스 상담 / 제공 항목: 위 수집 항목</small></span></label>
      <p class="msg" id="ws-msgbox" role="alert"></p>
      <button class="btn-primary submit" id="ws-go" type="submit">상담 신청하기</button>
    </form>
  </section>
  <p class="muted small ws-foot">서비스 내용과 조건은 왓섭의 상담에서 안내돼요.</p>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="whatssub.js"></script>
</body>
</html>
