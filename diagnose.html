<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 노출 진단</title>
  <meta name="description" content="업체명을 입력하면 AI 검색 엔진별 노출 현황을 진단서 형태로 보여 줍니다. 현재는 예시 리포트 화면입니다.">
  <style>
    :root{--purple:#A88AF4;--lav:#E9E0FC;--lime:#CAFE61;--char:#20242E;--text:#363C49;--line:#e6e4ef;--bg:#f5f4fa;--good:#1a7f37;--bad:#c92a2a}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    a{color:inherit}
    button,input,select{font:inherit;color:inherit}
    :focus-visible{outline:3px solid var(--purple);outline-offset:2px}
    .bar{background:var(--char);padding:0 20px}
    .bar-in{max-width:820px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between}
    .bar img{height:26px;width:auto;display:block}
    .bar .back{color:var(--lime);font-weight:700;font-size:15px;text-decoration:none}
    main{max-width:820px;margin:0 auto;padding:32px 20px 72px;display:grid;gap:16px}
    main>*,.card{min-width:0}
    h1{font-size:clamp(26px,4vw,34px);color:var(--char);margin:0;letter-spacing:-.02em;line-height:1.3}
    h2{font-size:15px;color:#5b6070;margin:0 0 12px;font-weight:700}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
    .lead{margin:6px 0 0}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
    .f{display:grid;gap:6px;align-content:start}
    .full{grid-column:1/-1}
    label{font-weight:700;font-size:15px;color:var(--char)}
    label em{color:#d6336c;font-style:normal}
    .opt{font-weight:400;color:#5b6070}
    input,select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
    input:focus,select:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px rgba(168,138,244,.3)}
    [aria-invalid=true]{border-color:#d6336c!important}
    .err{color:#c2255c;font-size:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;border:0;background:var(--char);color:#fff;font-weight:800;cursor:pointer}
    .btn:hover{background:#000}
    .banner{background:#fff3bf;color:#5c4a00;border:1px solid #f0d96b;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600}
    /* 리포트 */
    .rep-top{border-top:4px solid var(--purple)}
    .kick{font-size:12px;letter-spacing:.06em;color:#5b6070;margin:0 0 10px}
    .rep-top h2{font-size:26px;color:var(--char);margin:0 0 6px}
    .meta{font-size:14px;color:#5b6070;margin:2px 0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
    .stat b{display:block;font-size:40px;line-height:1.15;letter-spacing:-.02em;color:var(--char)}
    .stat small{display:block;font-size:13px;color:#5b6070}
    .stat.good b{color:var(--good)}.stat.bad b{color:var(--bad)}
    .tw{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:15px;min-width:420px}
    th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line)}
    th{font-size:13px;font-weight:600;color:#5b6070;white-space:nowrap}
    td.n{font-variant-numeric:tabular-nums}
    td.bad{color:var(--bad);font-weight:600}
    .sub{margin:22px 0 10px;font-size:13px;color:#5b6070;font-weight:600}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:14px}
    .chip.own{border-color:#3b5bdb;color:#3b5bdb;font-weight:600}
    .rivals{list-style:none;margin:0;padding:0}
    .rivals li{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
    .rivals b{color:var(--char)}
    .note{font-size:13px;color:#5b6070;margin:12px 0 0}
    @media(max-width:640px){
      .form{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr;gap:12px}
      .rivals li{grid-template-columns:1fr;gap:2px}
      .card{padding:18px}
    }
  </style>
</head>
<body>
<header class="bar"><div class="bar-in"><a href="landing.html" aria-label="처음으로"><img src="assets/logo.png" alt="EGP" width="72" height="25"></a><a class="back" href="landing.html#diagnosis">← 진단 예시로</a></div></header>

<main>
  <section class="card" aria-labelledby="t">
    <h1 id="t">우리 업체는 AI 답변에 얼마나 나올까요?</h1>
    <p class="lead">업체 정보를 입력하면 AI 검색 엔진별 노출 현황을 진단서로 보여 드립니다.</p>
    <form class="form" id="form" novalidate>
      <div class="f full"><label for="f-name">업체명 <em aria-hidden="true">*</em><span class="sr" style="position:absolute;left:-9999px"> (필수)</span></label><input id="f-name" name="name" maxlength="100" placeholder="예: 업체 이름" autocomplete="organization" aria-describedby="e-name"><small class="err" id="e-name" role="alert"></small></div>
      <div class="f"><label for="f-region">지역 <span class="opt">(선택)</span></label><input id="f-region" name="region" maxlength="50" placeholder="예: 강남"></div>
      <div class="f"><label for="f-ind">업종 <span class="opt">(선택)</span></label>
        <select id="f-ind"><option value="">선택해 주세요</option><option>병의원</option><option>웨딩</option><option>음식점</option><option>쇼핑몰</option><option>기타</option></select></div>
      <div class="f full"><label for="f-url">홈페이지 주소 <span class="opt">(선택)</span></label><input id="f-url" name="url" type="url" inputmode="url" maxlength="200" placeholder="https://" aria-describedby="e-url"><small class="err" id="e-url" role="alert"></small></div>
      <div class="full"><button class="btn" type="submit">진단하기</button></div>
    </form>
  </section>

  <div id="out" aria-live="polite"></div>
</main>

<script>
/* 리포트 데이터 형식 (실제 측정 서버가 이 형식으로 돌려주면 그대로 화면에 표시됩니다)
   { brand, url, region, industry, measuredAt, questions,
     engines:[{name, mention, cite, answers}],
     sources:[{d, n, own?}], rivals:[{name, why}],
     keywords:[{k, vol, rank|null, brief}] } */
const SAMPLE = {
  brand: "샘플웨딩홀 (예시)", url: "https://example.com", region: "서울 강남", industry: "웨딩홀",
  measuredAt: "예시 데이터 · 실제 측정값이 아닙니다", questions: 10,
  engines: [
    { name: "네이버", mention: 3, cite: 0, answers: 10 },
    { name: "Gemini", mention: 5, cite: 2, answers: 10 },
    { name: "GPT", mention: 2, cite: 1, answers: 10 },
    { name: "PPLX", mention: 4, cite: 0, answers: 10 },
  ],
  sources: [
    { d: "blog.example-a.com", n: 17 }, { d: "wedding-guide.example", n: 12 }, { d: "community.example", n: 10 },
    { d: "review.example", n: 9 }, { d: "example.com", n: 3, own: true }, { d: "video.example", n: 3 },
  ],
  rivals: [
    { name: "예시 업체 A", why: "접근성 좋은 웨딩홀 추천 질문에서 여러 엔진이 공통 추천" },
    { name: "예시 업체 B", why: "소규모 예식 가능 웨딩홀 질문에서 첫 번째로 언급" },
    { name: "예시 업체 C", why: "하우스웨딩 질문에서 대명사처럼 소개" },
    { name: "예시 업체 D", why: "고급 웨딩홀 추천 질문에서 단독 건물 특징과 함께 추천" },
  ],
  keywords: [
    { k: "지역 웨딩홀", vol: 2800, rank: null, brief: "없음" },
    { k: "샘플웨딩홀", vol: 8800, rank: 1, brief: "없음" },
    { k: "소규모 웨딩", vol: 20, rank: null, brief: "표시됨" },
  ],
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function render(d, entered) {
  const total = d.engines.reduce((s, e) => s + e.answers, 0);
  const men = d.engines.reduce((s, e) => s + e.mention, 0);
  const cit = d.engines.reduce((s, e) => s + e.cite, 0);
  const meta = [d.url, d.region, d.industry].filter(Boolean).map(esc).join(" · ");
  $("out").innerHTML = `
  <p class="banner" role="note">예시 리포트입니다. 입력하신 ${esc(entered)}의 실제 측정 결과가 아니며, 아직 AI 엔진과 연결되어 있지 않습니다.</p>
  <section class="card rep-top" aria-labelledby="r1">
    <p class="kick">AI 검색 노출 진단서</p>
    <h2 id="r1">${esc(d.brand)}</h2>
    <p class="meta">${meta}</p>
    <p class="meta">${esc(d.measuredAt)} · 측정 엔진 ${d.engines.map(e => esc(e.name)).join("·")}</p>
  </section>
  <section class="card" aria-labelledby="r2">
    <h2 id="r2">AI 검색 실측</h2>
    <div class="stats">
      <div class="stat"><b>${total}건</b><small>질문 ${d.questions}개 × ${d.engines.length}엔진 답변</small></div>
      <div class="stat good"><b>${pct(men, total)}%</b><small>브랜드 멘션 ${men}/${total}</small></div>
      <div class="stat bad"><b>${pct(cit, total)}%</b><small>자사 인용 ${cit}/${total}</small></div>
    </div>
    <div class="tw"><table><thead><tr><th>엔진</th><th>멘션</th><th>인용</th><th>답변</th></tr></thead><tbody>
      ${d.engines.map(e => `<tr><td>${esc(e.name)}</td><td class="n">${e.mention}/${e.answers}</td><td class="n">${e.cite}/${e.answers}</td><td class="n">${e.answers}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="sub">AI가 답변 근거로 쓴 출처</p>
    <div class="chips">${d.sources.map(s => `<span class="chip${s.own ? " own" : ""}">${esc(s.d)} ${s.n}회${s.own ? " · 자사" : ""}</span>`).join("")}</div>
    <p class="sub">AI가 대신 추천한 업체</p>
    <ul class="rivals">${d.rivals.map(r => `<li><b>${esc(r.name)}</b><span>${esc(r.why)}</span></li>`).join("")}</ul>
  </section>
  <section class="card" aria-labelledby="r3">
    <h2 id="r3">키워드 · 검색 수요와 현재 위치</h2>
    <div class="tw"><table><thead><tr><th>키워드</th><th>월 검색량(네이버)</th><th>구글 순위</th><th>AI 브리핑</th></tr></thead><tbody>
      ${d.keywords.map(k => `<tr><td><b>${esc(k.k)}</b></td><td class="n">${k.vol.toLocaleString("ko-KR")}회</td><td class="${k.rank ? "n" : "bad"}">${k.rank ? k.rank + "위" : "100위 밖"}</td><td>${esc(k.brief)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">표시된 숫자는 모두 형식을 보여 주기 위한 예시입니다.</p>
  </section>`;
  $("out").firstElementChild.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("f-name").value.trim(), url = $("f-url").value.trim();
  let bad = false;
  $("e-name").textContent = ""; $("f-name").removeAttribute("aria-invalid");
  $("e-url").textContent = ""; $("f-url").removeAttribute("aria-invalid");
  if (!name) { $("e-name").textContent = "업체명을 입력해 주세요."; $("f-name").setAttribute("aria-invalid", "true"); bad = true; }
  if (url) { try { if (!/^https?:$/.test(new URL(url).protocol)) throw 0; } catch (_) { $("e-url").textContent = "https:// 로 시작하는 주소를 입력해 주세요."; $("f-url").setAttribute("aria-invalid", "true"); bad = true; } }
  if (bad) { (document.querySelector("[aria-invalid=true]") || $("f-name")).focus(); return; }
  render(SAMPLE, name);
});
</script>
</body>
</html>
