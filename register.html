<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>체험단 등록 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="campaigns">
<div id="header-slot"></div>

<main class="wrap camp">
  <div class="camp-head"><h1>체험단 등록하기</h1><a class="muted" href="campaigns.html">← 목록으로</a></div>

  <form class="panel reg" id="reg-form">
    <p class="notice-box" id="gate" hidden></p>

    <div class="row two">
      <label>체험단 종류
        <select name="type"><option value="블로그">블로그</option><option value="인스타">인스타그램</option><option value="유튜브">유튜브</option><option value="구매평">구매평</option></select></label>
      <label>진행 방식
        <select name="mode" id="mode"><option>방문형</option><option>배송형</option></select></label>
    </div>

    <div class="row two">
      <label>지역
        <select name="region" id="region"><option>서울</option><option>경기</option><option>인천</option><option>강원</option><option>대전</option><option>세종</option><option>충남</option><option>충북</option><option>부산</option><option>울산</option><option>경남</option><option>경북</option><option>대구</option><option>광주</option><option>전남</option><option>전북</option><option>제주</option></select></label>
      <label>분야
        <select name="cat"><option>맛집</option><option>카페</option><option>뷰티</option><option>숙박</option><option>놀이</option><option>생활</option><option>기타</option></select></label>
    </div>

    <label>업체명 <input name="biz" required maxlength="20" placeholder="예) 성수루프"></label>
    <label>모집글 제목 <input name="title" required maxlength="60" placeholder="예) 성수동 루프탑 카페 신메뉴 체험단 모집"></label>
    <label>제공 혜택 <input name="reward" required maxlength="40" placeholder="예) 음료 2잔 + 디저트"></label>

    <div class="row two">
      <label>모집 인원 <input name="slots" type="number" min="1" max="999" value="5" required></label>
      <label>모집 마감일 <input name="deadline" type="date" required></label>
    </div>

    <div id="visit-box">
      <div class="row two">
        <label>방문 가능 시작일 <small>(선택)</small> <input name="visit_start" type="date"></label>
        <label>방문 가능 종료일 <small>(선택)</small> <input name="visit_end" type="date"></label>
      </div>
      <label>1팀 최대 방문 인원 <input name="max_party" type="number" min="1" max="10" value="4"></label>
      <label>방문 주소 <small>(지도에 표시돼요)</small> <input name="address" maxlength="120" placeholder="예) 경남 창원시 성산구 중앙대로 151"></label>
      <fieldset class="ox"><legend>방문 가능 요일 <small>(아무것도 안 고르면 모든 요일)</small></legend>
        <label><input type="checkbox" name="wd" value="1"> 월</label><label><input type="checkbox" name="wd" value="2"> 화</label><label><input type="checkbox" name="wd" value="3"> 수</label><label><input type="checkbox" name="wd" value="4"> 목</label><label><input type="checkbox" name="wd" value="5"> 금</label><label><input type="checkbox" name="wd" value="6"> 토</label><label><input type="checkbox" name="wd" value="0"> 일</label></fieldset>
      <label>방문 가능 시간대 <small>(쉼표로 구분, 비우면 신청자가 직접 입력)</small> <input name="visit_times" maxlength="80" placeholder="11:00, 14:00, 16:00"></label>
      <label>방문 및 예약 안내 <small>(선택)</small> <textarea name="visit_notes" rows="4" maxlength="1500" placeholder="예) 방문 전 예약 필수, 노쇼 시 패널티, 주차 안내 등"></textarea></label>
    </div>

    <label>추가 미션 <small>(선택 · 예: 방문 후 24시간 내 후기 작성)</small>
      <input name="mission" maxlength="100"></label>
    <p class="muted small" style="margin-top:-8px">※ 대가를 받고 작성하는 후기에는 <b>광고·협찬 표기</b>가 필요합니다. 추가 미션에 표기 문구를 넣어 주세요.</p>

    <details class="reg-more">
      <summary>상세 안내 입력 (선택)</summary>
      <label>안내 문구 <small>(상세 페이지 위쪽에 눈에 띄게 표시)</small> <textarea name="notice" rows="3" maxlength="600"></textarea></label>
      <label>키워드 <small>(쉼표로 구분)</small> <input name="keywords" maxlength="100" placeholder="맛집, 서울맛집, 체험단"></label>
      <label>배송 안내 <small>(배송형일 때)</small> <textarea name="shipping_info" rows="3" maxlength="800"></textarea></label>
      <label>상품정보 주소 <small>(선택)</small> <input name="product_url" type="text" inputmode="url" placeholder="예) smartstore.naver.com/... (https:// 없이 써도 돼요)"></label>
      <label>후기 작성 마감일 <input name="review_deadline" type="date"></label>
      <div class="row two">
        <label>사진 최소 장수 <input name="mission_photos" type="number" min="0" max="100" placeholder="예) 15"></label>
        <label>글자 수 <input name="mission_chars" type="number" min="0" max="10000" placeholder="예) 1000"></label>
      </div>
      <fieldset class="ox"><legend>미션 조건</legend>
        <label><input type="checkbox" name="mission_link"> 링크 첨부</label>
        <label><input type="checkbox" name="mission_video"> 동영상 또는 GIF</label>
        <label><input type="checkbox" name="mission_disclosure" checked> 광고·협찬 표기</label></fieldset>
      <label>상세 이미지 <small>(포스터 등, 선택)</small> <input id="detail-photo" type="file" accept="image/*"></label>
    </details>

    <label>네이버 플레이스 주소 <small>(선택)</small>
      <input name="place" type="text" inputmode="url" placeholder="예) naver.me/... 또는 map.naver.com/... (https:// 없이 써도 돼요)"></label>

    <label>대표 사진
      <input id="photo" type="file" accept="image/*"></label>
    <div class="preview" id="preview" hidden></div>

    <label>상세 안내 <small>(방문 가능 시간, 작성 조건 등)</small>
      <textarea name="desc" rows="5" maxlength="1000"></textarea></label>

    <p class="notice-box small">⚠ 마감일까지 신청자를 <b>한 명도 선정하지 않으면</b> 미선정횟수가 부과되고, 5회가 쌓이면 페널티(등록 정지)가 적용돼요. <a href="penalty.html"><b>정책 보기 →</b></a></p>
    <p class="muted small">신청자는 광고주가 직접 선정합니다. 후기는 게시일로부터 <b>6개월까지 2차 활용</b>할 수 있다는 동의를 신청자에게 받습니다. 구매평 체험단은 포인트가 지급되지 않습니다.</p>
    <button class="btn-primary submit" type="submit">등록하기</button>
  </form>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="register.js"></script>
</body>
</html>
