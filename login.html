<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>로그인 / 회원가입 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="header-slot"></div>

<main class="wrap camp">
  <div class="panel auth">
    <div class="tabs" role="tablist">
      <button class="tab on" id="tab-login" type="button">로그인</button>
      <button class="tab" id="tab-signup" type="button">회원가입</button>
    </div>

    <p class="notice-box" id="no-key" hidden>⚠ 서버 연결 키가 아직 설정되지 않았습니다. (<code>config.js</code>)</p>

    <form id="form" class="reg">
      <fieldset class="kind-row" id="kind-row" hidden>
        <legend>가입 유형</legend>
        <label class="kind"><input type="radio" name="kind" value="business"><span>개인사업자</span></label>
        <label class="kind"><input type="radio" name="kind" value="influencer"><span>인플루언서</span></label>
        <label class="kind"><input type="radio" name="kind" value="agency"><span>대행사</span></label>
        <p class="muted small" id="kind-hint">가입 유형을 선택해 주세요.</p>
      </fieldset>
      <label id="nick-row" hidden>닉네임 <input name="nickname" maxlength="12" placeholder="2~12자"></label>
      <label>이메일 <input name="email" type="email" required autocomplete="email"></label>
      <label>비밀번호 <input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="8자 이상"></label>
      <label class="check" id="agree-row" hidden><input type="checkbox" name="agree">
        <span><b><a href="terms.html" target="_blank" rel="noopener">이용약관</a>과 <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>에 동의합니다.</b></span></label>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn-primary submit" id="submit" type="submit">로그인</button>
    </form>
    <div class="sent" id="sent" hidden>
      <div class="sent-ico">✉️</div>
      <h2>인증 메일을 보냈어요</h2>
      <p><b id="sent-email"></b> 로 인증 메일을 보냈습니다.<br>메일의 <b>Confirm email address</b> 링크를 누르면 가입이 완료됩니다.</p>
      <ul class="sent-tips">
        <li>몇 분 안에 오지 않으면 <b>스팸메일함</b>을 확인해 주세요.</li>
        <li>링크를 누른 뒤 이 사이트에서 <b>로그인</b>해 주세요.</li>
      </ul>
      <button class="btn-primary submit" id="goto-login" type="button">인증했어요, 로그인하기</button>
      <button class="link-btn" id="resend" type="button">인증 메일 다시 보내기</button>
      <p class="msg" id="resend-msg" role="status"></p>
    </div>
    <p class="muted small" id="foot-note" style="text-align:center;margin-top:14px">가입 유형에 따라 가입 후 운영자 승인이 필요해요. 개인사업자와 대행사는 사업자등록증을 제출해야 해요.</p>
  </div>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
