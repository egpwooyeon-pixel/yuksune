<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>광고주 인증 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="campaigns">
<div id="header-slot"></div>

<main class="wrap camp">
  <div class="camp-head"><h1>광고주 인증</h1></div>
  <p class="empty" id="b-msg" hidden></p>

  <section class="panel biz" id="biz" hidden>
    <div class="biz-state" id="b-state"></div>

    <form class="reg" id="b-form" hidden>
      <p class="muted small">체험단을 등록하려면 <b>사업자등록번호와 대표자 이름</b>만 입력해 주세요. 사업자등록증은 필요 없고, 입력하면 <b>바로</b> 광고주로 이용할 수 있어요.</p>
      <label>사업자등록번호 <small>(10자리, 하이픈은 있어도 없어도 돼요)</small>
        <input id="b-no" inputmode="numeric" maxlength="12" placeholder="000-00-00000" autocomplete="off" required></label>
      <label>대표자 이름
        <input id="b-ceo" maxlength="20" placeholder="사업자등록증에 적힌 대표자 이름" autocomplete="off" required></label>
      <label class="check"><input type="checkbox" id="b-consent" required>
        <span><b>개인정보 수집·이용에 동의합니다.</b><br><small>수집 항목: 사업자등록번호, 대표자 이름 / 이용 목적: 광고주 확인, 체험단 등록 권한 부여 / <a href="privacy.html" target="_blank" rel="noopener">처리방침 보기</a></small></span></label>
      <p class="msg" id="b-err" role="alert"></p>
      <button class="btn-primary submit" id="b-btn" type="submit">광고주 인증하기</button>
    </form>
  </section>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="boarddata.js"></script>
<script src="biz.js"></script>
</body>
</html>
