<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>체험단 - 우리들 체험단</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="campaigns">
<div id="header-slot"></div>

<main class="wrap cl">
  <div class="ad-rail" id="ad-rail">
    <a class="egp-banner" href="landing.html" target="_blank" rel="noopener" aria-label="EGP AI 스튜디오 바로가기 (새 창)">
      <img src="assets/logo.png" alt="" width="72" height="25">
      <span class="egp-t"><b>AI 검색 시대,</b><br>우리 업체 노출 점검</span>
      <span class="egp-cta">EGP AI 스튜디오 →</span>
    </a>
    <!-- 결제기반 AI 마케팅 소개 카드 (EGP 배너 아래). 누르면 신청 페이지(pay-ai.html)로 이동 -->
    <a class="ws-ad" id="ws-ad" href="pay-ai.html" aria-label="결제기반 AI 마케팅 상담 신청">
      <span class="ws-t"><b>결제 기반 데이터로</b><br>마케팅하세요</span>
      <span class="ws-cta">결제기반 AI 마케팅 →</span>
    </a>
  </div>
  </div>
  <div class="cl-top">
    <div>
      <p class="cl-kick" id="cl-kick">체험단</p>
      <button type="button" class="cl-region-btn" id="rg-toggle" aria-expanded="true">지역 <i>▾</i></button>
    </div>
    <a class="cl-reg" href="register.html">+ 체험단 등록하기 <small>(사업자 전용)</small></a>
  </div>

  <div class="cl-region" id="rg-wrap">
    <div class="cl-region-sel" id="rg-sel">지역을 선택해 주세요.</div>
    <div class="cl-chips" id="region-chips"></div>
  </div>

  <div class="cl-tabs" id="cl-tabs" role="tablist" aria-label="체험단 보기"></div>

  <div class="cl-filters">
    <select id="f-cat" aria-label="카테고리"><option value="">카테고리</option></select>
    <select id="f-ch" aria-label="채널"><option value="">채널</option></select>
    <select id="f-mode" aria-label="유형"><option value="">유형</option><option value="방문형">방문형</option><option value="배송형">배송형</option></select>
    <select id="f-sort" aria-label="정렬"><option value="">기본 정렬</option><option value="new">최신순</option><option value="deadline">마감임박순</option><option value="hot">신청 많은순</option></select>
  </div>

  <p class="cl-note" id="cl-note" role="status" hidden></p>
  <ul class="cl-cards" id="cards"></ul>
  <div class="empty" id="empty" role="status" hidden></div>
  <div class="more"><button id="more" type="button">더보기</button></div>
</main>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="campaigns.js"></script>
</body>
</html>
