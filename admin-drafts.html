<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>글 초안 검수 - 관리자</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .dr-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
    .dr-list{max-height:75vh;overflow:auto}
    .dr-item{display:block;width:100%;text-align:left;border:1px solid #e5e8ee;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
    .dr-item.on{border-color:#1f4dff;background:#f4f7ff}.dr-item b{display:block;font-size:14px}.dr-item small{color:#6b7280}
    .chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-right:4px}
    .chip.draft{background:#eef2ff;color:#1f4dff}.chip.approved{background:#e6f6ec;color:#1a7f37}.chip.rejected{background:#f1f2f4;color:#6b7280}.chip.block{background:#ffe3e3;color:#c92a2a}.chip.warn{background:#fff3bf;color:#7a5b00}
    .dr-f{display:grid;gap:4px;margin-bottom:12px}.dr-f label{font-size:12px;font-weight:700;color:#4b5563}
    .dr-f input,.dr-f textarea{border:1px solid #dcdfe6;border-radius:8px;padding:8px 10px;font:inherit;width:100%;background:#fff}
    .dr-sec{border:1px solid #e5e8ee;border-radius:12px;padding:12px;margin-bottom:12px;background:#fafbfd}
    .dr-lint{list-style:none;margin:0 0 12px;padding:0}.dr-lint li{padding:6px 0;border-bottom:1px solid #f1f2f5;font-size:13px}
    .dr-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
    .dr-ro{background:#f7f8fa;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;overflow-wrap:anywhere}
    .dr-msg{font-size:13px;min-height:1.4em}.dr-msg.err{color:#c92a2a}.dr-msg.ok{color:#1a7f37}
    @media(max-width:900px){.dr-grid{grid-template-columns:1fr}.dr-list{max-height:none}}
  </style>
</head>
<body>
<div class="ad-gate" id="gate">관리자 확인 중…</div>
<div class="ad" id="app" hidden>
  <aside class="ad-side">
    <a class="ad-brand" href="admin.html"><b>우리들 체험단</b><small>ADMIN · 관리자</small></a>
    <nav id="nav"><a href="admin.html">← 관리자 홈</a><a href="admin-inquiries.html">상담 접수 (EGP)</a><a href="admin-drafts.html" class="on">글 초안 (EGP)</a></nav>
    <div class="ad-me"><div><b id="me-name"></b> <em>관리자</em><small id="me-mail"></small></div></div>
    <a class="ad-back" href="campaigns.html">← 사이트로 돌아가기</a>
  </aside>
  <main class="ad-main">
    <div class="ad-top"><div><small class="kick">DRAFTS</small><h1>글 초안 검수</h1></div><button class="btn" type="button" id="new-btn">+ 새 초안 만들기</button></div>
    <p class="note">AI가 쓴 글은 <b>초안</b>이에요. 사실과 문구를 확인하고 검수 메모를 남겨야 승인할 수 있어요. 자동 검사에서 <b>차단</b> 항목이 남아 있으면 승인되지 않아요. 입력한 사실에 있는 표현은 자동으로 막지 않으니 사람이 꼭 확인하세요. 승인해도 이 화면에서 공개되지는 않아요.</p>
    <div class="dr-grid">
      <div class="box dr-list"><div class="box-h"><b>초안 목록</b><select id="st" aria-label="상태"><option value="">전체</option><option value="draft">초안</option><option value="approved">승인</option><option value="rejected">반려</option></select></div><div id="list"></div><p class="empty" id="list-empty" hidden>초안이 아직 없어요.</p></div>
      <div class="box" id="panel"><p class="empty">왼쪽에서 초안을 고르거나 새 초안을 만드세요.</p></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin-drafts.js"></script>
</body>
</html>
